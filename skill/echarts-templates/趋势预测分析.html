<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>趋势预测分析</title>
<meta http-equiv="refresh" content="1800">
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#fff; color:#1f2d3d; font-family:'Segoe UI','Microsoft YaHei',sans-serif; padding:24px 32px; }
  h1 { font-size:20px; margin-bottom:4px; }
  .sub { color:#8492a6; font-size:12px; margin-bottom:18px; }
  .explain { background:#f8f9fb; border-left:4px solid #27ae60; padding:12px 18px; font-size:13px; line-height:1.8; border-radius:0 8px 8px 0; margin-bottom:20px; }
  #chart { width:100%; height:480px; }
  .note { color:#8492a6; font-size:11px; margin-top:10px; }
</style>
</head>
<body>
<h1>趋势预测分析</h1>
<div class="sub">历史实线 + 预测虚线延伸(含置信区间带)｜ ECharts 专长模板</div>
<div class="explain">实线 = 历史实际值;虚线 = 未来预测值;浅色带 = 预测置信区间。预测基于历史线性/移动平均外推,供趋势判断参考。</div>
<div id="chart"></div>
<div class="note">预测算法:线性回归外推。数据点不足 6 期时自动降级为均值延伸。⚙ 右下角可设刷新频率。</div>

<script>
/*__DATA__*/
// DATA: { history: { labels:[], values:[] }, forecast: { labels:[], values:[], upper:[], lower:[] } }
// 若无 forecast 字段则用简单线性回归自动生成
const D = typeof DATA !== 'undefined' ? DATA : null;

const historyLabels = D.history.labels;
const historyValues = D.history.values.map(Number);
let forecastLabels = D.forecast ? D.forecast.labels : [];
let forecastValues = D.forecast ? D.forecast.values.map(Number) : [];
let forecastUpper = D.forecast && D.forecast.upper ? D.forecast.upper.map(Number) : null;
let forecastLower = D.forecast && D.forecast.lower ? D.forecast.lower.map(Number) : null;

// 无预测数据时:线性回归自动外推 6 期
if (!forecastValues.length && historyValues.length >= 3) {
  const n = historyValues.length;
  const xs = historyValues.map((_, i) => i);
  const ys = historyValues;
  const mx = xs.reduce((a,b)=>a+b,0)/n, my = ys.reduce((a,b)=>a+b,0)/n;
  const slope = xs.reduce((s,x,i)=>s+(x-mx)*(ys[i]-my),0) / xs.reduce((s,x)=>s+(x-mx)*(x-mx),0);
  const FN = 6;
  for (let i = 1; i <= FN; i++) {
    const xi = n - 1 + i;
    forecastLabels.push('预测+' + i);
    forecastValues.push(Math.round((my + slope * (xi - mx)) * 100) / 100);
  }
  forecastUpper = forecastValues.map(v => Math.round(v * 1.1 * 100) / 100);
  forecastLower = forecastValues.map(v => Math.round(v * 0.9 * 100) / 100);
}

// X 轴拼接(历史+预测)
const allLabels = historyLabels.concat(forecastLabels);

// 系列1:历史实线(预测段为 null 断开)
const histData = historyValues.concat(forecastLabels.map(() => null));
// 桥接:预测线从最后一个历史点开始
const bridge = [null]; // 占位对齐
const fcData = historyValues.map(() => null);
fcData[fcData.length - 1] = historyValues[historyValues.length - 1]; // 从最后历史点起步
forecastValues.forEach(v => fcData.push(v));
// 置信区间上下界(与预测对齐)
const upperData = historyValues.map(() => null).concat(forecastUpper || []);
const lowerData = historyValues.map(() => null).concat(forecastLower || []);

echarts.init(document.getElementById('chart')).setOption({
  tooltip:{ trigger:'axis' },
  legend:{ data:['实际值','预测值','置信上限','置信下限'], top:0, textStyle:{ fontSize:11 } },
  grid:{ left:70, right:40, top:50, bottom:40 },
  xAxis:{ type:'category', data:allLabels, boundaryGap:false, axisLabel:{ fontSize:11 } },
  yAxis:{ type:'value', scale:true, splitLine:{ lineStyle:{ color:'#f2f4f7' } } },
  series:[
    { name:'实际值', type:'line', data:histData, smooth:true, lineStyle:{ width:3, color:'#4d6bfe' }, itemStyle:{ color:'#4d6bfe' }, symbolSize:6, connectNulls:false },
    { name:'预测值', type:'line', data:fcData, smooth:true, lineStyle:{ width:2.5, type:'dashed', color:'#e67e22' }, itemStyle:{ color:'#e67e22' }, symbol:'triangle', symbolSize:7 },
    (forecastUpper ? { name:'置信上限', type:'line', data:upperData, lineStyle:{ opacity:0 }, symbol:'none', stack:'ci', areaStyle:{ opacity:0 }, silent:true } : null),
    (forecastUpper ? { name:'预测值2', type:'line', data:fcData, lineStyle:{ opacity:0 }, symbol:'none', stack:'ci2', silent:true, areaStyle:{ color:'rgba(230,126,34,.12)' } } : null),
  ].filter(Boolean)
});
</script>
</body>
</html>
