<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>一车间生产看板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#fff; font-family:'Segoe UI','Microsoft YaHei',sans-serif; color:#1f2d3d; padding:18px 26px; }
  .top { text-align:center; padding:6px 0 2px; }
  .top h1 { font-size:19px; letter-spacing:2px; }
  .top .sub { color:#a0aec0; font-size:12px; margin-top:2px; }
  .filters { display:flex; gap:10px; padding:12px 0; border-bottom:1px solid #f2f4f7; margin-bottom:4px; }
  .filter { border:1px solid #dfe4ea; border-radius:6px; padding:5px 14px; font-size:13px; color:#1f2d3d; background:#fff; }
  .filter b { font-weight:600; }
  .filter.dim { color:#8492a6; background:#f7f9fb; border-style:dashed; }
  .kpis { display:flex; gap:0; margin:10px 0 14px; border:1px solid #ebeef5; border-radius:10px; overflow:hidden; }
  .kpi { flex:1; padding:12px 18px; border-right:1px solid #f2f4f7; }
  .kpi:last-child { border-right:none; }
  .kpi .l { font-size:11px; color:#8492a6; }
  .kpi .v { font-size:22px; font-weight:700; margin-top:2px; }
  .kpi .v.red { color:#e74c3c; } .kpi .v.green { color:#27ae60; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  thead th { background:#fafbfc; color:#8492a6; font-weight:500; font-size:12px; text-align:right; padding:8px 12px; border-bottom:1px solid #ebeef5; white-space:nowrap; }
  thead th:first-child { text-align:left; }
  td { text-align:right; padding:7px 12px; border-bottom:1px solid #f5f6f8; white-space:nowrap; }
  td:first-child { text-align:left; }
  tr.wc td { background:#f8fafc; font-weight:600; border-bottom:1px solid #e8ecf0; cursor:pointer; }
  tr.wc:hover td { background:#eef3f8; }
  tr.sum td { color:#27ae60; font-weight:600; background:#fcfdfd; font-size:12px; }
  tr.op td { color:#4a5568; }
  tr.op.overdue td { color:#e74c3c; }
  tr.op:hover td { background:#f7f9fb; }
  .pill { display:inline-block; padding:2px 12px; border-radius:999px; font-size:12px; font-weight:600; }
  .pg { background:#27ae60; color:#fff; } .pf { background:#e74c3c; color:#fff; }
  .pw { background:#f39c12; color:#fff; } .pm { background:#3498db; color:#fff; }
  .pc { background:#95a5a6; color:#fff; }
  .rate-good { color:#27ae60; font-weight:600; border-bottom:2px solid #27ae60; padding-bottom:1px; }
  .rate-bad { color:#e74c3c; font-weight:600; border-bottom:2px solid #e74c3c; padding-bottom:1px; }
  .chart-title { font-size:14px; font-weight:600; text-align:center; margin:20px 0 4px; }
  #statusChart { width:100%; height:230px; }
  .footer { color:#a0aec0; font-size:11px; padding:10px 0 4px; display:flex; justify-content:space-between; }
  .paging span { display:inline-block; min-width:24px; text-align:center; padding:2px 4px; border-radius:4px; }
  .paging .on { background:#3498db; color:#fff; }
</style>
</head>
<body>

<div class="top"><h1>一车间生产看板</h1><div class="sub" id="sub"></div></div>

<div class="kpis" id="kpis"></div>

<table>
  <thead><tr>
    <th>工作中心 / 工序</th><th>机台状态</th><th>工单数</th><th>计划数量</th><th>已报数量</th><th>剩余数量</th><th>逾期工序</th><th>平均良品率</th><th>平均达成率</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>

<div class="chart-title">当天设备状态统计图</div>
<div id="statusChart"></div>

<div class="footer">
  <div>工作中心 <b id="f1"></b> 个 · 在制工单 <b id="f2"></b> 个</div>
  <div class="paging">自包含单文件 · ECharts 产线</div>
</div>

<script>
const WC = /*__WC__*/[];
const OPS = /*__OPS__*/[];
const STATUS = /*__STATUS__*/[];
const smap = Object.fromEntries(STATUS.map(s=>[s.name, Number(s.machines)]));
const counts = all.map(s => smap[s] || 0);
const total = counts.reduce((a,b)=>a+b,0) || 1;
const colors = {'正常运行':'#27ae60','调机':'#f1c40f','待料':'#f39c12','换模':'#3498db','保养中':'#95a5a6','故障停机':'#e74c3c'};
echarts.init(document.getElementById('statusChart')).setOption({
  tooltip:{trigger:'axis'},
  grid:{left:40,right:50,top:30,bottom:30},
  xAxis:{type:'category',data:all,axisLabel:{fontSize:12,color:'#1f2d3d'}},
  yAxis:[
    {type:'value',name:'机台数',splitLine:{lineStyle:{color:'#f2f4f7'}}},
    {type:'value',max:100,axisLabel:{formatter:'{value}%'},splitLine:{show:false}}
  ],
  series:[
    {name:'机台数',type:'bar',data:counts.map((c,i)=>({value:c,itemStyle:{color:colors[all[i]],borderRadius:[4,4,0,0]}})),barWidth:'36%',
     label:{show:true,position:'top',formatter:p=>`${p.value} (${Math.round(p.value/total*1000)/10}%)`,color:'#1f2d3d',fontSize:11}},
    {name:'占比',type:'line',data:counts.map(c=>Math.round(c/total*1000)/10),yAxisIndex:1,lineStyle:{color:'#8e44ad',width:2},itemStyle:{color:'#8e44ad'},symbol:'circle',symbolSize:6,smooth:true}
  ]
});
</script>
</body>
</html>
