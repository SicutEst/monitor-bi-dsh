<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>财务驾驶舱(漂亮版)</title>
<meta http-equiv="refresh" content="1800">
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#fff; color:#1f2d3d; font-family:'Segoe UI','Microsoft YaHei',sans-serif; padding:24px 32px; }
  h1 { font-size:20px; margin-bottom:4px; }
  .sub { color:#8492a6; font-size:12px; margin-bottom:20px; }
  .quad { display:flex; gap:16px; margin-bottom:20px; }
  .q { flex:1; border:1px solid #e2e8f0; border-radius:10px; padding:16px 20px; }
  .q .l { font-size:12px; color:#8492a6; }
  .q .v { font-size:30px; font-weight:700; margin-top:6px; }
  .q .v.income { color:#27ae60; } .q .v.expense { color:#e74c3c; } .q .v.profit { color:#4d6bfe; } .q .v.cash { color:#8e44ad; }
  .duo { display:flex; gap:16px; margin-bottom:16px; }
  .card { flex:1; background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:14px 16px; }
  .card h3 { font-size:13px; color:#1f2d3d; margin-bottom:8px; font-weight:600; }
  #revExp, #aging { width:100%; height:300px; }
  .aging-table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .aging-table th { text-align:right; color:#8492a6; font-weight:500; padding:8px 10px; border-bottom:2px solid #1f2d3d; font-size:12px; }
  .aging-table th:first-child { text-align:left; }
  .aging-table td { padding:8px 10px; text-align:right; border-bottom:1px solid #f2f4f7; }
  .aging-table td:first-child { text-align:left; font-weight:500; }
  .footer { color:#a0aec0; font-size:11px; margin-top:10px; }
</style>
</head>
<body>
<h1>财务驾驶舱</h1>
<div class="sub">数据源 bi 数仓 · 收入/支出/利润/现金流四象限 · 同比对比 · 应收账龄</div>

<div class="quad">
  <div class="q"><div class="l">本期收入</div><div class="v income" id="kIncome"></div><div class="l" id="dIncome"></div></div>
  <div class="q"><div class="l">本期支出</div><div class="v expense" id="kExpense"></div><div class="l" id="dExpense"></div></div>
  <div class="q"><div class="l">本期利润</div><div class="v profit" id="kProfit"></div><div class="l" id="dProfit"></div></div>
  <div class="q"><div class="l">期末现金流</div><div class="v cash" id="kCash"></div><div class="l">银行+现金+等价物</div></div>
</div>

<div class="duo">
  <div class="card"><h3>收入 vs 支出(月度)</h3><div id="revExp"></div></div>
  <div class="card"><h3>应收账款账龄</h3><div id="aging" style="height:140px"></div>
    <table class="aging-table" id="agingTable">
      <thead><tr><th>账龄区间</th><th>金额</th><th>占比</th></tr></thead><tbody></tbody>
    </table>
  </div>
</div>

<div class="footer">财务驾驶舱 · 单文件自包含 · 数据源 bi 数仓(gl/voucher 类表) · 模板列名按实际 gl 表调整</div>

<script>
/*__DATA__*/
// DATA: { kpis:{income,expense,profit,cash,dIncome,dExpense,dProfit},
//         revExp:{labels:[],income:[],expense:[]},
//         aging:{buckets:[{name,value,pct}]} }
const fmt = n => Number(n||0).toLocaleString('zh-CN', {maximumFractionDigits:0});

document.getElementById('kIncome').textContent = fmt(DATA.kpis.income);
document.getElementById('kExpense').textContent = fmt(DATA.kpis.expense);
document.getElementById('kProfit').textContent = fmt(DATA.kpis.profit);
document.getElementById('kCash').textContent = fmt(DATA.kpis.cash);
document.getElementById('dIncome').textContent = DATA.kpis.dIncome || '';
document.getElementById('dExpense').textContent = DATA.kpis.dExpense || '';
document.getElementById('dProfit').textContent = DATA.kpis.dProfit || '';

echarts.init(document.getElementById('revExp')).setOption({
  tooltip:{trigger:'axis'},
  legend:{data:['收入','支出','利润'],top:0,textStyle:{fontSize:11}},
  grid:{left:70,right:30,top:36,bottom:30},
  xAxis:{type:'category',data:DATA.revExp.labels,axisLabel:{fontSize:11}},
  yAxis:{type:'value',splitLine:{lineStyle:{color:'#f2f4f7'}},axisLabel:{formatter:v=>v>=10000?(v/10000)+'万':v}},
  series:[
    {name:'收入',type:'bar',data:DATA.revExp.income,itemStyle:{color:'#27ae60',borderRadius:[4,4,0,0]},barWidth:'26%'},
    {name:'支出',type:'bar',data:DATA.revExp.expense,itemStyle:{color:'#e74c3c',borderRadius:[4,4,0,0]},barWidth:'26%'},
    {name:'利润',type:'line',data:DATA.revExp.income.map((v,i)=>v-DATA.revExp.expense[i]),smooth:true,lineStyle:{width:2.5,color:'#4d6bfe'},itemStyle:{color:'#4d6bfe'},symbolSize:7}
  ]
});

echarts.init(document.getElementById('aging')).setOption({
  tooltip:{trigger:'item',formatter:'{b}: {c} ({d}%)'},
  series:[{type:'pie',radius:['46%','72%'],
    data:DATA.aging.buckets.map((b,i)=>({name:b.name,value:b.value,itemStyle:{color:['#27ae60','#f39c12','#e67e22','#e74c3c'][i%4]}})),
    label:{formatter:'{b}\n{d}%',fontSize:11}, itemStyle:{borderColor:'#fff',borderWidth:2}}]
});
document.getElementById('agingTable').querySelector('tbody').innerHTML =
  DATA.aging.buckets.map(b => `<tr><td>${b.name}</td><td>${fmt(b.value)}</td><td>${b.pct}%</td></tr>`).join('');
</script>
</body>
</html>
